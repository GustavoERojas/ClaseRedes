<!DOCTYPE html>
<html>
<head>
    <title>Login - Monitoreo Motor</title>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: Arial;
            text-align: center;
        }
        .container {
            margin-top: 100px;
        }
        .login-card {
            background: #1e293b;
            margin: 15px auto;
            padding: 30px;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,255,200,0.3);
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
        }
        button {
            background: #00ffcc;
            color: #0f172a;
            padding: 10px 20px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        button:hover {
            background: #00ccaa;
        }
        .error {
            color: #ff6b6b;
            margin-top: 10px;
        }
        h2 {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <h2>🔐 Sistema de Monitoreo</h2>
            <h3>Control de Motor DC</h3>
            <form method="POST">
                <input type="text" name="user" placeholder="Usuario" required autofocus>
                <input type="password" name="password" placeholder="Contraseña" required>
                <button type="submit">Ingresar</button>
                {% if error %}
                    <p class="error">{{ error }}</p>
                {% endif %}
            </form>
        </div>
    </div>
</body>
</html>
